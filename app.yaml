command:
  - streamlit
  - run
  - app.py
  - --server.address=0.0.0.0
  - --server.port=8000
  - --server.headless=true
  - --browser.gatherUsageStats=false
env:
  - name: ENDPOINT_NAME
    value: projects/new-database/branches/production/endpoints/primary
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: databricks-qwen3-embedding-0-6b
  - name: LOG_LEVEL
    value: INFO
